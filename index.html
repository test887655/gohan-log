<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ごはん記録</title>

<meta name="theme-color" content="#e07a3f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ごはん記録">

<link rel="stylesheet" href="style.css">

<script>
  // 画面が出る前に見た目を決める。あとから当てるとチカッと切り替わってしまう
  try {
    const saved = localStorage.getItem('theme');
    if (saved === 'cute' || saved === 'adult' || saved === 'dark') {
      document.documentElement.dataset.theme = saved;
    }
  } catch (error) { /* プライベートブラウズなどで使えない場合は既定の見た目 */ }
</script>
</head>
<body>

<!-- お花のイラスト。使い回せるよう1か所にまとめておく -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <!-- 塗るか線で描くかは、見た目ごとにCSS変数で決める -->
  <symbol id="flower" viewBox="-12 -12 24 24">
    <g fill="var(--flower-fill, currentColor)"
       stroke="var(--flower-stroke, none)"
       stroke-width="var(--flower-stroke-width, 0)">
      <ellipse cx="0" cy="-5.6" rx="3.1" ry="5.1"/>
      <ellipse cx="0" cy="-5.6" rx="3.1" ry="5.1" transform="rotate(72)"/>
      <ellipse cx="0" cy="-5.6" rx="3.1" ry="5.1" transform="rotate(144)"/>
      <ellipse cx="0" cy="-5.6" rx="3.1" ry="5.1" transform="rotate(216)"/>
      <ellipse cx="0" cy="-5.6" rx="3.1" ry="5.1" transform="rotate(288)"/>
    </g>
    <circle r="2.5" fill="var(--flower-core, #fff)"/>
  </symbol>

  <!-- キラキラ。ダイヤを2つ並べたもの。押すとポイントが貯まる -->
  <symbol id="sparkle" viewBox="0 0 24 24">
    <path d="M9.2 2.6l1.7 4.6 4.6 1.7-4.6 1.7-1.7 4.6-1.7-4.6L2.9 8.9l4.6-1.7z" fill="#f0b429"/>
    <path d="M17.2 12.6l1 2.7 2.7 1-2.7 1-1 2.7-1-2.7-2.7-1 2.7-1z" fill="#f7d372"/>
  </symbol>

  <!-- 星。3日に一度のボーナスのときだけ、キラキラの代わりに出す -->
  <symbol id="star" viewBox="0 0 24 24">
    <path d="M12 2.4l2.9 6 6.6.9-4.8 4.7 1.1 6.6L12 17.5l-5.8 3.1 1.1-6.6L2.5 9.3l6.6-.9z"
          fill="#f5c542" stroke="#dfa726" stroke-width=".8" stroke-linejoin="round"/>
  </symbol>

  <!-- プレゼント箱。冷蔵庫やお茶碗と同じで、色はSVGに直接書く -->
  <symbol id="gift" viewBox="0 0 24 24">
    <path d="M4.6 11.6h14.8v7.6c0 .8-.6 1.4-1.4 1.4H6c-.8 0-1.4-.6-1.4-1.4z" fill="#e4716a"/>
    <path d="M4.2 7.8h15.6c.6 0 1 .4 1 1v1.8c0 .6-.4 1-1 1H4.2c-.6 0-1-.4-1-1V8.8c0-.6.4-1 1-1z" fill="#d1564f"/>
    <g fill="#f2c14e">
      <path d="M10.6 7.8h2.8v12.8h-2.8z"/>
      <path d="M12 7.8C10.9 5.3 9.8 4 8.5 4a1.9 1.9 0 000 3.8z"/>
      <path d="M12 7.8c1.1-2.5 2.2-3.8 3.5-3.8a1.9 1.9 0 010 3.8z"/>
    </g>
  </symbol>

  <!-- ごはん茶碗。ごはんの画面へ戻るボタンに使う。
       冷蔵庫と同じで、色はSVGに直接書く -->
  <symbol id="rice" viewBox="0 0 24 24">
      <!-- ごはん。茶碗の縁からはみ出さない幅で、こんもり盛る -->
      <path d="M6 12c0-2.3 1.4-4.1 3.3-4.9.8-.3 1.1.2 1.7-.2.8-.6 1.7-.8 2.5-.5.8.3 1.2 1.1 2 1.3 1.6.5 2.5 2.1 2.5 4.3z"
            fill="#fffdf7" stroke="#cdc0a8" stroke-width=".9" stroke-linejoin="round"/>
      <!-- 茶碗 -->
      <path d="M4.6 12h14.8c0 3.6-3 6.5-6.6 6.5h-1.6c-3.6 0-6.6-2.9-6.6-6.5z" fill="#6f93ad"/>
      <!-- 高台（茶碗の脚） -->
      <path d="M10 18.4h4l.9 2.2H9.1z" fill="#5c7d94"/>
  </symbol>

  <!-- 写真。アルバムのボタンに使う。ほかの絵と同じで色はSVGに直接書く -->
  <symbol id="photo" viewBox="0 0 24 24">
    <rect x="3" y="5" width="18" height="14" rx="2.2" fill="#f0ece4" stroke="#b9ae9c" stroke-width="1"/>
    <circle cx="8.6" cy="9.8" r="1.5" fill="#e8b34a"/>
    <path d="M4.4 17.6l4.4-4.6 3 3 3.4-3.8 4.4 5.4z" fill="#8fae86"/>
  </symbol>

  <!-- 地図のピン。外食したお店の名前の頭に付ける。
       ほかの絵と同じで、色はSVGに直接書く（CSSが古いままでも真っ黒にならないように） -->
  <symbol id="pin" viewBox="0 0 24 24">
    <path d="M12 2.2c-3.6 0-6.5 2.9-6.5 6.5 0 4.8 5.6 11.5 6.1 12.1.2.3.6.3.8 0
             .5-.6 6.1-7.3 6.1-12.1 0-3.6-2.9-6.5-6.5-6.5z" fill="#e4716a"/>
    <circle cx="12" cy="8.7" r="2.4" fill="#fdf6f2"/>
  </symbol>

  <!-- 開いたドア。ログアウトのボタンに使う。
       冷蔵庫・お茶碗・プレゼントと同じで、色はSVGに直接書く。
       上下に横木を渡すと26pxでもドアだと分かる（フリー素材の絵を測って合わせた）。
       戸口の中は塗らない。背景が透けて、奥が見えている形になる -->
  <symbol id="door" viewBox="0 0 24 24">
    <!-- 上と下の横木 -->
    <rect x="4.3" y="0.5" width="15.4" height="1.34" fill="#b6afa6"/>
    <rect x="4.3" y="22.16" width="15.4" height="1.34" fill="#b6afa6"/>
    <!-- 戸口の枠。内側をくり抜くので fill-rule は evenodd -->
    <path d="M5.05 1.84H18.96V22.16H5.05Z M5.8 2.59H18.21V21.41H5.8Z" fill="#9a9289" fill-rule="evenodd"/>
    <!-- 蝶番側の影 -->
    <rect x="5.8" y="2.59" width="0.37" height="18.82" fill="#746d64"/>
    <!-- 手前に開いた扉 -->
    <path d="M6.17 2.59L13.02 5.1V18.9L6.17 21.41Z" fill="#8b8379"/>
    <!-- 取っ手 -->
    <ellipse cx="12.7" cy="12" rx=".83" ry=".53" fill="#f2f0ee"/>
  </symbol>

  <!-- ゴミ箱。食材を消すボタンに使う -->
  <symbol id="trash" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 6.8h15"/>
      <path d="M9.6 6.8V5.2c0-.6.5-1.1 1.1-1.1h2.6c.6 0 1.1.5 1.1 1.1v1.6"/>
      <path d="M6.6 6.8l.8 12.3c.1.8.7 1.4 1.5 1.4h6.2c.8 0 1.4-.6 1.5-1.4l.8-12.3"/>
      <path d="M10.4 10.4v6.6M13.6 10.4v6.6"/>
    </g>
  </symbol>
</svg>

<main id="screen-login" class="screen">
  <h1>ごはん記録</h1>
  <form id="login-form">
    <label>
      メールアドレス
      <input type="email" id="email" autocomplete="username" required>
    </label>
    <label>
      パスワード
      <input type="password" id="password" autocomplete="current-password" required>
    </label>
    <button type="submit" id="login-button" class="primary">ログイン</button>
  </form>
  <p id="login-error" class="error" hidden></p>
</main>

<main id="screen-app" class="screen" hidden>
  <header>
    <div class="title-row">
      <h1><svg class="flower flower-title" aria-hidden="true"><use href="#flower"/></svg>ごはん記録</h1>
      <button type="button" id="point-button" class="point-button"
              aria-label="プレゼントを見る" title="プレゼント" hidden>
        <span id="point-total">0</span>
        <svg class="gift-icon" aria-hidden="true"><use href="#gift"/></svg>
      </button>
    </div>
    <button id="logout-button" class="icon-button" aria-label="ログアウト" title="ログアウト">
      <svg class="door-icon" aria-hidden="true"><use href="#door"/></svg>
    </button>
  </header>

  <div class="toolbar">
    <button type="button" id="ingredient-toggle" class="icon-button round" aria-pressed="false"
            aria-label="食材リスト" title="食材リスト">
      <svg class="fridge-icon" viewBox="0 0 24 24" aria-hidden="true">
        <!-- 本体。上が冷凍室、下が冷蔵室 -->
        <rect x="5.4" y="1.8" width="13.2" height="20.4" rx="1.8" fill="#eaf0f4"/>
        <path d="M5.4 9.6h13.2v10.8a1.8 1.8 0 01-1.8 1.8H7.2a1.8 1.8 0 01-1.8-1.8z" fill="#dbe3ea"/>
        <!-- 仕切り -->
        <rect x="5.4" y="8.8" width="13.2" height=".8" fill="#a9b6c1"/>
        <!-- 取っ手。冷蔵庫だと分かる決め手なので、濃いめに描く -->
        <g fill="#6f7c88">
          <rect x="15" y="4.3" width="1.2" height="3.2" rx=".6"/>
          <rect x="15" y="11.2" width="1.2" height="4.6" rx=".6"/>
        </g>
        <!-- 外枠 -->
        <rect x="5.4" y="1.8" width="13.2" height="20.4" rx="1.8"
              fill="none" stroke="#8d9aa6" stroke-width="1"/>
      </svg>
    </button>

    <div class="theme-picker" role="group" aria-label="見た目を選ぶ">
      <button type="button" class="theme-option" data-theme="simple">シンプル</button>
      <button type="button" class="theme-option" data-theme="adult">大人</button>
      <button type="button" class="theme-option" data-theme="cute">かわいい</button>
      <button type="button" class="theme-option" data-theme="dark">ダーク</button>
    </div>
  </div>

  <p id="greeting" class="hint"></p>

  <section id="view-meals">
  <button id="open-form-button" class="primary block">＋ 記録する</button>

  <form id="meal-form" hidden>
    <h2 id="meal-form-title">食事を記録</h2>

    <label>
      写真（任意）
      <input type="file" id="photo" accept="image/*" aria-label="写真">
    </label>
    <img id="photo-preview" class="preview" alt="選んだ写真" hidden>
    <p id="photo-hint" class="hint" hidden></p>

    <fieldset>
      <legend>区分</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="meal_type" value="breakfast" aria-label="朝" required> 朝</label>
        <label class="chip"><input type="radio" name="meal_type" value="lunch" aria-label="昼"> 昼</label>
        <label class="chip"><input type="radio" name="meal_type" value="dinner" aria-label="夜"> 夜</label>
        <label class="chip"><input type="radio" name="meal_type" value="snack" aria-label="間食"> 間食</label>
      </div>
    </fieldset>

    <label>
      日時
      <input type="datetime-local" id="eaten-at" required>
    </label>

    <label>
      お店の名前
      <input type="text" id="place" maxlength="40" placeholder="任意（外食のとき）">
    </label>

    <label>
      ひとことメモ
      <input type="text" id="note" maxlength="100" placeholder="任意">
    </label>

    <div class="row">
      <button type="submit" id="save-button" class="primary">保存</button>
      <button type="button" id="cancel-button" class="link">キャンセル</button>
    </div>
    <p id="form-error" class="error" hidden></p>
  </form>

  <nav class="week-nav">
    <button id="prev-week" class="week-arrow" aria-label="前の週">‹</button>
    <p id="week-range" class="week-range" aria-live="polite"></p>
    <button id="next-week" class="week-arrow" aria-label="次の週">›</button>
  </nav>
  <button id="this-week" class="link week-jump" hidden>今週へ戻る</button>

  <!-- ★を付けた記録だけを集めた画面へ -->
  <div class="favorite-bar">
    <button type="button" id="album-open" class="favorite-open">
      <svg class="star-icon" aria-hidden="true"><use href="#photo"/></svg>
      アルバム
    </button>
    <button type="button" id="favorite-open" class="favorite-open">
      <svg class="star-icon" aria-hidden="true"><use href="#star"/></svg>
      お気に入り
    </button>
  </div>

  <div id="timeline-empty" class="empty">
    <svg class="flower flower-empty" aria-hidden="true"><use href="#flower"/></svg>
    <p id="timeline-status" class="hint">読み込み中…</p>
  </div>
  <section id="timeline"></section>
  </section>

  <section id="view-ingredients" hidden>
    <div class="view-head">
      <h2>食材リスト</h2>
      <button type="button" id="back-to-meals" class="icon-button round"
              aria-label="ごはんに戻る" title="ごはんに戻る">
        <svg class="rice-icon" aria-hidden="true"><use href="#rice"/></svg>
      </button>
    </div>

    <button id="open-ingredient-button" class="primary block">＋ 食材を追加</button>

    <form id="ingredient-form" hidden>
      <h2 id="ingredient-form-title">食材を追加</h2>

      <label>
        名前
        <input type="text" id="ingredient-name" maxlength="30" required>
      </label>

      <fieldset>
        <legend>数量（任意）</legend>
        <div class="chips wrap" id="quantity-chips">
          <label class="chip"><input type="radio" name="quantity" value="" aria-label="なし" checked> なし</label>
          <label class="chip"><input type="radio" name="quantity" value="1" aria-label="1"> 1</label>
          <label class="chip"><input type="radio" name="quantity" value="2" aria-label="2"> 2</label>
          <label class="chip"><input type="radio" name="quantity" value="3" aria-label="3"> 3</label>
          <label class="chip"><input type="radio" name="quantity" value="4" aria-label="4"> 4</label>
          <label class="chip"><input type="radio" name="quantity" value="5" aria-label="5"> 5</label>
          <label class="chip"><input type="radio" name="quantity" value="6" aria-label="6"> 6</label>
          <label class="chip"><input type="radio" name="quantity" value="7" aria-label="7"> 7</label>
          <label class="chip"><input type="radio" name="quantity" value="8" aria-label="8"> 8</label>
          <label class="chip"><input type="radio" name="quantity" value="9" aria-label="9"> 9</label>
          <label class="chip"><input type="radio" name="quantity" value="10" aria-label="10"> 10</label>
          <label class="chip"><input type="radio" name="quantity" value="1/2" aria-label="2分の1"> 1/2</label>
          <label class="chip"><input type="radio" name="quantity" value="1/4" aria-label="4分の1"> 1/4</label>
          <label class="chip"><input type="radio" name="quantity" value="custom" aria-label="任意"> 任意</label>
        </div>
        <!-- 11以上や「少々」など、ボタンにない数量はここに書く。
             日本語も入れられるよう type は text にしてある -->
        <input type="text" id="ingredient-quantity" maxlength="10"
               placeholder="11、少々 など" aria-label="数量を自分で書く" hidden>
      </fieldset>

      <fieldset>
        <legend>単位</legend>
        <div class="chips wrap" id="unit-chips">
          <label class="chip"><input type="radio" name="unit" value="" aria-label="なし" checked> なし</label>
          <label class="chip"><input type="radio" name="unit" value="個" aria-label="個"> 個</label>
          <label class="chip"><input type="radio" name="unit" value="g" aria-label="g"> g</label>
          <label class="chip"><input type="radio" name="unit" value="ml" aria-label="ml"> ml</label>
          <label class="chip"><input type="radio" name="unit" value="本" aria-label="本"> 本</label>
          <label class="chip"><input type="radio" name="unit" value="枚" aria-label="枚"> 枚</label>
          <label class="chip"><input type="radio" name="unit" value="袋" aria-label="袋"> 袋</label>
          <label class="chip"><input type="radio" name="unit" value="パック" aria-label="パック"> パック</label>
          <label class="chip"><input type="radio" name="unit" value="玉" aria-label="玉"> 玉</label>
          <label class="chip"><input type="radio" name="unit" value="束" aria-label="束"> 束</label>
          <label class="chip"><input type="radio" name="unit" value="缶" aria-label="缶"> 缶</label>
        </div>
      </fieldset>

      <label>
        賞味期限（任意）
        <input type="date" id="ingredient-expires">
      </label>

      <fieldset>
        <legend>保存場所</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="storage" value="fridge" aria-label="冷蔵" checked> 冷蔵</label>
          <label class="chip"><input type="radio" name="storage" value="freezer" aria-label="冷凍"> 冷凍</label>
          <label class="chip"><input type="radio" name="storage" value="pantry" aria-label="常温"> 常温</label>
        </div>
      </fieldset>

      <div class="row">
        <button type="submit" id="ingredient-save" class="primary">保存</button>
        <button type="button" id="ingredient-cancel" class="link">キャンセル</button>
      </div>
      <p id="ingredient-error" class="error" hidden></p>
    </form>

    <div id="ingredient-empty" class="empty">
      <svg class="flower flower-empty" aria-hidden="true"><use href="#flower"/></svg>
      <p id="ingredient-status" class="hint">読み込み中…</p>
    </div>
    <section id="ingredient-list"></section>
  </section>

  <!-- ★を付けた記録だけを集めた画面。自分の記録だけが出る -->
  <section id="view-favorites" hidden>
    <div class="view-head">
      <h2>お気に入り</h2>
      <button type="button" id="back-to-meals-favorites" class="icon-button round"
              aria-label="ごはんに戻る" title="ごはんに戻る">
        <svg class="rice-icon" aria-hidden="true"><use href="#rice"/></svg>
      </button>
    </div>

    <div id="favorite-empty" class="empty">
      <svg class="flower flower-empty" aria-hidden="true"><use href="#flower"/></svg>
      <p id="favorite-status" class="hint">読み込み中…</p>
    </div>
    <section id="favorite-list"></section>
    <button type="button" id="favorite-more" class="link block-link" hidden>もっと見る</button>
  </section>

  <!-- 写真だけをタイルで並べる画面。2人ぶんが新しい順に並ぶ -->
  <section id="view-album" hidden>
    <div class="view-head">
      <h2>アルバム</h2>
      <button type="button" id="back-to-meals-album" class="icon-button round"
              aria-label="ごはんに戻る" title="ごはんに戻る">
        <svg class="rice-icon" aria-hidden="true"><use href="#rice"/></svg>
      </button>
    </div>

    <div id="album-empty" class="empty">
      <svg class="flower flower-empty" aria-hidden="true"><use href="#flower"/></svg>
      <p id="album-status" class="hint">読み込み中…</p>
    </div>
    <div id="album-grid" class="album-grid"></div>
    <button type="button" id="album-more" class="link block-link" hidden>もっと見る</button>
  </section>

  <!-- 朝・昼・夜に1回ずつ、画面のどこかに出る -->
  <button type="button" id="sparkle-button" class="sparkle" aria-label="キラキラを取る" hidden>
    <svg class="sparkle-icon" aria-hidden="true"><use href="#sparkle"/></svg>
  </button>
  <p id="point-toast" class="point-toast" role="status" hidden></p>

  <!-- プレゼント。用意するのは自分、選ぶのは相手 -->
  <div id="gift-panel" class="overlay" hidden>
    <div class="sheet">
      <div class="view-head">
        <h2>プレゼント</h2>
        <button type="button" id="gift-close" class="link">閉じる</button>
      </div>
      <p class="hint"><strong id="gift-points">0</strong> ポイント持っています</p>

      <h3 id="partner-gift-title">もらえるもの</h3>
      <div id="partner-gifts" class="gift-list"></div>
      <p id="partner-gifts-empty" class="hint" hidden>相手がまだ用意していません。</p>

      <h3>自分が用意するもの</h3>
      <div id="my-gifts" class="gift-list"></div>
      <p id="my-gifts-empty" class="hint" hidden>まだありません。相手が選べるものを作りましょう。</p>

      <button type="button" id="open-gift-form" class="primary block">＋ プレゼントを作る</button>

      <form id="gift-form" hidden>
        <h3 id="gift-form-title">プレゼントを作る</h3>
        <label>
          内容
          <input type="text" id="gift-name" maxlength="30" placeholder="肩たたき券 など" required>
        </label>
        <label>
          必要なポイント
          <input type="number" id="gift-cost" min="1" max="9999" step="1" inputmode="numeric" required>
        </label>
        <div class="row">
          <button type="submit" id="gift-save" class="primary">保存</button>
          <button type="button" id="gift-cancel" class="link">キャンセル</button>
        </div>
        <p id="gift-error" class="error" hidden></p>
      </form>
    </div>
  </div>

  <!-- 相手がプレゼントを選んだときのお知らせ -->
  <div id="gift-news" class="overlay" hidden>
    <div class="sheet narrow">
